name: pantau

on:
  schedule:
    - cron: "*/5 * * * *"    # watch: referral telegram, cepat, tanpa ambang
    - cron: "*/10 * * * *"   # ringan: 4 kueri + forum
    - cron: "17 */4 * * *"   # berat: semua kueri + subreddit + buka halaman
  workflow_dispatch:
    inputs:
      mode:
        description: "watch, fast, atau deep"
        default: "deep"
        required: false

# watch punya grup sendiri supaya tidak mengantre di belakang deep yang 6 menit
concurrency:
  group: pantau-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: tentukan mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then
            echo "flag=--watch" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then
            echo "flag=--fast" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.mode }}" in
              watch) echo "flag=--watch" >> "$GITHUB_OUTPUT" ;;
              fast)  echo "flag=--fast" >> "$GITHUB_OUTPUT" ;;
              *)     echo "flag=--deep" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "flag=--deep" >> "$GITHUB_OUTPUT"
          fi

      # DB ikut antar run: cache terbaru dipulihkan lewat restore-keys
      - name: pulihkan DB
        uses: actions/cache@v4
        with:
          path: data
          key: pantau-db-${{ github.run_id }}
          restore-keys: |
            pantau-db-

      - name: pindai
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          if [ "${{ steps.mode.outputs.flag }}" = "--watch" ]; then
            python -m pantau.cli watch
          else
            python -m pantau.cli run ${{ steps.mode.outputs.flag }}
          fi
          python -m pantau.cli stats

      - name: simpan hasil
        if: always() && github.event.schedule != '*/10 * * * *'
        uses: actions/upload-artifact@v4
        with:
          name: pantau-export
          path: data/export/
          retention-days: 30
          if-no-files-found: ignore