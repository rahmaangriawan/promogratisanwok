# config.yaml — pelacak kode promo / voucher / bansos AI

engine:
  - gnews
  - bing

max_queries: 6          # kueri per putaran (bergiliran)
max_age_hours: 24       # hanya terbitan 24 jam terakhir

rate:
  delay_min: 2.0
  delay_max: 4.5
  timeout: 20
  retries: 3
  workers: 3
  jitter: true

store:
  db: "data/pantau.db"
  export_dir: "data/export"

score:
  min_keep: 6
  min_notify: 45
  min_notify_coded: 28

notify:
  discord_webhook: "${DISCORD_WEBHOOK:-}"
  telegram_token: "${TELEGRAM_TOKEN:-}"
  telegram_chat: "${TELEGRAM_CHAT:-}"

# frasa yang benar-benar muncul di media 24 jam terakhir
queries:
  - "claude gratis"
  - "chatgpt gratis"
  - "gemini gratis"
  - "ai gratis untuk mahasiswa"
  - "bansos ai"
  - "kredit ai gratis"
  - "free ai credits"
  - "promo langganan ai"
  - "diskon langganan ai"
  - "kode promo ai"
  - "voucher ai gratis"
  - "ai trial gratis"
  - "gratis token ai"
  - "akses ai gratis"

site_queries:
  - "site:t.me kode promo ai"
  - "site:reddit.com claude pro promo"
  - "site:reddit.com chatgpt plus free"

# umpan RSS tambahan (semua bertanggal, ikut disaring 24 jam)
feeds:
  - name: hn_freeai
    url: "https://hnrss.org/newest?q=free+credits+ai"
  - name: hn_promo
    url: "https://hnrss.org/newest?q=promo+code+ai"

trust:
  "github.com": 3
  "reddit.com": 2
  "news.ycombinator.com": 2
  "dev.to": 1
  "medium.com": 1
