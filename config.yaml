# config.yaml — pelacak kode promo / voucher / bansas AI

max_queries: 6          # kueri mesin pencari per putaran (bergiliran)
max_age_hours: 24       # hanya terbitan 24 jam terakhir

engine:
  - gnews
  - bing_html     # halaman hasil Bing (lebih banyak dari RSS-nya)
  - yandex        # HTML; sering kena captcha, jadi hasilnya bolong-bolong
  - github        # issue/PR sering memuat kode voucher
  - lemmy

# Search API resmi Yandex (gratis, 100 kueri/hari). Isi kalau captcha mengganggu.
yandex:
  user: "${YANDEX_USER:-}"
  key: "${YANDEX_KEY:-}"

rate:
  delay_min: 1.5
  delay_max: 3.5
  timeout: 20
  retries: 3
  workers: 3
  jitter: true

store:
  db: "data/pantau.db"
  export_dir: "data/export"

score:
  min_keep: 6
  min_notify: 45
  min_notify_coded: 28

notify:
  discord_webhook: "${DISCORD_WEBHOOK:-}"
  telegram_token: "${TELEGRAM_TOKEN:-}"
  telegram_chat: "${TELEGRAM_CHAT:-}"

queries:
  - "claude gratis"
  - "chatgpt gratis"
  - "gemini gratis"
  - "grok gratis"
  - "deepseek gratis"
  - "kimi gratis"
  - "glm gratis"
  - "qwen gratis"
  - "bansos ai"
  - "kredit ai gratis"
  - "free ai credits"
  - "promo langganan ai"
  - "ai trial gratis"
  - "gratis token ai"

site_queries:
  - "site:t.me kode promo ai"
  - "site:reddit.com claude pro promo"
  - "site:reddit.com chatgpt plus free"

# forum Discourse: pencarian memakai filter after: milik Discourse
forums:
  - "https://community.openai.com"
  - "https://forum.cursor.com"
  - "https://community.n8n.io"
  - "https://discuss.huggingface.co"
  - "https://community.vercel.com"

community_queries:
  - "free credits"
  - "promo code"
  - "giveaway"

# jalur cepat (pantau watch): kanal Telegram publik yang ramai tautan referral
telegram_channels:
  - freeaicredits
  - promogratisan
  - claudeai

subreddits:
  - ClaudeAI
  - ChatGPT
  - OpenAI
  - Bard
  - LocalLLaMA
  - freebies
  - singularity

reddit:
  client_id: "${REDDIT_CLIENT_ID:-}"
  client_secret: "${REDDIT_CLIENT_SECRET:-}"
  user_agent: "macos:pantau:1.0.0 (by /u/pantau)"

feeds:
  - name: hn_freeai
    url: "https://hnrss.org/newest?q=free+credits+ai"

trust:
  "github.com": 3
  "reddit.com": 2
  "news.ycombinator.com": 2
  "community.openai.com": 3
  "forum.cursor.com": 3
  "community.n8n.io": 1
  "discuss.huggingface.co": 2
  "community.vercel.com": 1
